  notes: `
<h3>6.1 Wireless fundamentals</h3>
<h4>Types of wireless networks (college slides)</h4>
<table>
<tr><th>Type</th><th>Range</th><th>Standard / example</th></tr>
<tr><td><b>WPAN</b> (personal)</td><td>Short, about 6 to 9 m</td><td>IEEE 802.15: Bluetooth, Zigbee</td></tr>
<tr><td><b>WLAN</b> (local)</td><td>Up to about 100 m (300 ft)</td><td>IEEE 802.11 (Wi-Fi), 2.4 and 5 GHz</td></tr>
<tr><td><b>WMAN</b> (metropolitan)</td><td>City or district</td><td>WiMAX</td></tr>
<tr><td><b>WWAN</b> (wide area)</td><td>National or global</td><td>Cellular (4G, 5G), satellite</td></tr>
</table>
<p>Wireless uses <b>radio waves</b> in the unlicensed spectrum (Wi-Fi, Bluetooth) or licensed spectrum (cellular). Benefits: mobility, easy installation, flexibility. Drawbacks: interference, limited range, and security risk because anyone in range can listen.</p>

<h4>Characteristics of wireless channels (⚠ beyond the slides)</h4>
<p>A radio channel is much less reliable than a cable. Main properties:</p>
<ul>
<li><b>Path loss (attenuation):</b> the signal gets weaker with distance. In free space, loss in decibels is FSPL = 20 log<sub>10</sub>(d<sub>km</sub>) + 20 log<sub>10</sub>(f<sub>MHz</sub>) + 32.44. Doubling the distance adds about <b>6 dB</b>. <span class="ex">Example: d = 0.1 km, f = 2,400 MHz: −20 + 67.6 + 32.44 = <b>80 dB</b>.</span></li>
<li><b>Shadowing:</b> walls, hills and bodies block or absorb the signal.</li>
<li><b>Multipath fading:</b> the signal bounces off objects and arrives by several paths at slightly different times, adding or cancelling at the receiver.</li>
<li><b>Interference and noise:</b> other Wi-Fi networks, Bluetooth, microwave ovens (2.4 GHz), and thermal noise.</li>
<li><b>Variable and unpredictable quality:</b> conditions change as devices move.</li>
<li><b>Half-duplex and broadcast nature:</b> everyone in range hears the transmission; a node cannot hear a collision while it sends (hence CSMA/CA).</li>
<li><b>Hidden terminal problem:</b> A and C are both in range of B but cannot hear each other, so they may transmit to B at the same time and collide at B. RTS/CTS helps.</li>
</ul>
<svg viewBox="0 0 560 120" class="dg" role="img" aria-label="Hidden terminal problem">
<circle cx="110" cy="62" r="46" class="box" stroke-dasharray="4 4"/><circle cx="450" cy="62" r="46" class="box" stroke-dasharray="4 4"/>
<circle cx="110" cy="62" r="8" class="nd"/><circle cx="280" cy="62" r="8" class="nd"/><circle cx="450" cy="62" r="8" class="nd"/>
<text x="110" y="100" class="t">A</text><text x="280" y="100" class="t">B (receiver)</text><text x="450" y="100" class="t">C</text>
<line x1="118" y1="62" x2="272" y2="62" class="ln"/><line x1="288" y1="62" x2="442" y2="62" class="ln"/>
<text x="280" y="22" class="ts">A and C cannot hear each other, both send to B: collision at B</text>
</svg>
<p><b>SNR</b> (signal-to-noise ratio) = signal power ÷ noise power, in dB. Example: signal −60 dBm and noise −90 dBm give SNR = <b>30 dB</b>. Higher SNR allows faster data rates, so Wi-Fi chooses its rate from the SNR (<b>rate adaptation</b>). <b>Shannon's limit:</b> C = B log<sub>2</sub>(1 + SNR). With B = 20 MHz and SNR = 30 dB (= 1000): C = 20 × 10<sup>6</sup> × log<sub>2</sub>(1001) ≈ <b>199 Mbps</b>.</p>

<h4>IEEE 802.11 (Wi-Fi)</h4>
<table>
<tr><th>Standard</th><th>Band</th><th>Data rate</th></tr>
<tr><td>802.11 (original)</td><td>2.4 GHz</td><td>up to 2 Mb/s</td></tr>
<tr><td>802.11a</td><td>5 GHz</td><td>up to 54 Mb/s (not interoperable with b/g)</td></tr>
<tr><td>802.11b</td><td>2.4 GHz</td><td>up to 11 Mb/s; better range and penetration</td></tr>
<tr><td>802.11g</td><td>2.4 GHz</td><td>up to 54 Mb/s; compatible with b</td></tr>
<tr><td>802.11n (Wi-Fi 4)</td><td>2.4 and 5 GHz</td><td>150 to 600 Mb/s; MIMO (multiple antennas)</td></tr>
<tr><td>802.11ac (Wi-Fi 5)</td><td>5 GHz</td><td>450 Mb/s to 1.3 Gb/s</td></tr>
<tr><td>802.11ax (<b>Wi-Fi 6</b>)</td><td>2.4 and 5 GHz</td><td>High-Efficiency Wireless (HEW)</td></tr>
<tr><td>Wi-Fi 6E ⚠</td><td>adds the <b>6 GHz</b> band</td><td>same standard as Wi-Fi 6 on a new, less crowded band</td></tr>
</table>
<p>⚠ Wi-Fi 6 improves performance with many devices: <b>OFDMA</b> (splits a channel among several users), <b>MU-MIMO</b> in both directions, <b>target wake time</b> (saves battery). Standards bodies: <b>ITU-R</b> (regulates spectrum), <b>IEEE</b> (802.11 standards), <b>Wi-Fi Alliance</b> (certifies interoperability).</p>
<h4>WLAN components</h4>
<ul>
<li><b>Wireless NIC</b> in the device; <b>wireless home router</b> (access point + switch + router in one); <b>access point (AP)</b> joins wireless clients to the wired LAN.</li>
<li><b>Autonomous APs</b> are configured one by one. <b>Controller-based (lightweight) APs</b> are managed by a <b>WLC (wireless LAN controller)</b> using <b>CAPWAP</b>: an IEEE protocol that tunnels AP-to-controller traffic over UDP ports <b>5246 (control) and 5247 (data)</b>, with <b>DTLS</b> encryption of control traffic. In the <b>split MAC</b> design the AP does time-critical work (beacons, probe responses, acknowledgments, frame queuing, encryption) and the WLC does authentication, association and roaming.</li>
<li><b>Antennas</b> and <b>MIMO</b> (multiple input, multiple output): several antennas increase speed and reliability.</li>
</ul>
<h4>WLAN operation</h4>
<ul>
<li><b>Modes:</b> <b>infrastructure</b> (clients connect through an AP) and <b>ad hoc</b> (clients connect directly; tethering is a form of it).</li>
<li><b>BSS</b> (basic service set): one AP and its associated clients. <b>ESS</b> (extended service set): two or more BSSs joined through the wired network, so clients can move between APs under one SSID.</li>
<li><b>CSMA/CA</b> (college slides): WLANs are half-duplex and a node cannot hear a collision while sending. A client (1) listens until the channel is idle, (2) sends an <b>RTS</b> (request to send) to the AP, (3) receives a <b>CTS</b> (clear to send), (4) waits a random time if no CTS, (5) transmits, (6) expects an <b>ACK</b>; no ACK means a collision, so it starts again.</li>
<li><b>Association</b> has three stages: <b>discover</b> an AP, <b>authenticate</b>, <b>associate</b>. Agreed settings: SSID, password, network mode, security mode, channel. <b>Passive scanning:</b> the AP broadcasts periodic <b>beacon frames</b> with the SSID, standards and security. <b>Active scanning:</b> the client broadcasts a <b>probe request</b> on several channels.</li>
</ul>
<h4>Channels</h4>
<p>Spread-spectrum techniques reduce interference: <b>DSSS</b> (802.11b), <b>FHSS</b> (original 802.11), <b>OFDM</b> (802.11a/g/n/ac). The 2.4 GHz band has channels 22 MHz wide, 5 MHz apart, so neighbouring channels overlap. Use <b>non-overlapping channels 1, 6 and 11</b> (centres 2412, 2437 and 2462 MHz, 25 MHz apart) for neighbouring APs. The 5 GHz band has many more non-overlapping 20 MHz channels (the slides give 36, 48 and 60 as examples), which is why it is less crowded.</p>

<h4>Cellular networks (⚠ beyond the slides; the slides name CDMA and cellular broadband)</h4>
<p>A cellular network divides an area into <b>cells</b>, each served by a <b>base station</b>. Neighbouring cells use different frequencies, and the same frequencies are reused in cells far apart (<b>frequency reuse</b>), which gives high capacity. Base stations connect to a <b>core network</b> that connects calls and the internet.</p>
<table>
<tr><th></th><th>4G LTE</th><th>5G</th></tr>
<tr><td>Design</td><td>All-IP network, OFDMA in the downlink</td><td>New radio (5G NR) and a cloud-style core</td></tr>
<tr><td>Typical speed</td><td>Tens to a few hundred Mbps</td><td>Hundreds of Mbps to a few Gbps in practice (the official peak target is 20 Gbps)</td></tr>
<tr><td>Delay</td><td>About 30 to 50 ms</td><td>As low as about 1 ms</td></tr>
<tr><td>Spectrum</td><td>Below 6 GHz</td><td>Low, mid and <b>millimetre-wave</b> bands</td></tr>
<tr><td>Devices</td><td>Mostly phones</td><td>Very many devices (IoT)</td></tr>
</table>
<p>5G has three main uses: <b>eMBB</b> (enhanced mobile broadband), <b>URLLC</b> (ultra-reliable low-latency, e.g. remote surgery, vehicles) and <b>mMTC</b> (massive machine-type communication: IoT). It adds <b>small cells</b> and <b>network slicing</b> (virtual networks tailored to different needs).</p>

<h3>6.2 Mobility management (⚠)</h3>
<p>Mobility means a device keeps its connection while it moves.</p>
<h4>Handoff (handover)</h4>
<p>A <b>handoff</b> is the process of switching a moving device's connection from one AP or base station to another without dropping the call or session. It is triggered when the signal from the current station gets weak and another is stronger. <b>Hard handoff:</b> break the old link before making the new one (a brief gap). <b>Soft handoff:</b> connect to the new station before leaving the old one (no gap; used in CDMA networks). In Wi-Fi, <b>roaming</b> between APs of one ESS (same SSID) is the equivalent. Handoff management has to choose when to switch, find a station with free capacity, and move the session state.</p>
<h4>Mobile IP</h4>
<p>An IP address normally identifies a location. When a device moves to another network, its address would have to change and its connections would break. <b>Mobile IP</b> lets it keep a permanent address:</p>
<ul>
<li><b>Home address</b> and <b>home agent</b> (a router on the home network).</li>
<li><b>Foreign agent</b> and <b>care-of address</b> (the address in the visited network).</li>
</ul>
<ol>
<li>The device registers its care-of address with its home agent.</li>
<li>A sender still sends to the <b>home address</b>; the home agent <b>intercepts</b> the packets and <b>tunnels</b> them (encapsulates them in a new packet) to the care-of address.</li>
<li>The device replies directly to the sender, which gives <b>triangular routing</b> (inefficient); route optimisation can fix it.</li>
</ol>
<h4>Location services</h4>
<p>Finding where a device is: <b>GPS</b> (satellites, outdoors), <b>cell-ID</b> (which base station serves the phone), <b>Wi-Fi positioning</b> (known locations of nearby APs), and <b>triangulation or trilateration</b> from signal strength or timing to several stations. Used for navigation, emergency calls, and delivering calls to a roaming user (the network keeps a record of which cell each phone is in). Privacy concern: location data is sensitive.</p>

<h3>6.3 Wireless security</h3>
<h4>Threats (college slides)</h4>
<ul>
<li><b>Interception of data:</b> anyone in range can capture unencrypted traffic.</li>
<li><b>Wireless intruders:</b> unauthorised users joining the network.</li>
<li><b>Denial of service (DoS):</b> by misconfiguration, accidental interference, or deliberate jamming.</li>
<li><b>Rogue access point:</b> an AP connected to the network without authorisation. An attacker can use it to capture MAC addresses and packets, reach network resources or run a man-in-the-middle attack; even a phone hotspot can act as one.</li>
<li><b>Man-in-the-middle / evil twin:</b> the attacker sets up an AP with the <b>same SSID</b> as a real one so clients connect to it and the attacker reads or changes their traffic.</li>
</ul>
<h4>Early defences (and why they are weak)</h4>
<p><b>SSID cloaking</b> (do not broadcast the SSID) and <b>MAC address filtering</b> (allow only listed MACs). Both are easily bypassed ⚠ (SSIDs and MACs can be seen on the air and MACs can be copied), so they are not real security.</p>
<h4>Authentication and encryption</h4>
<table>
<tr><th>Method</th><th>Notes</th></tr>
<tr><td><b>Open</b></td><td>No password; used in cafes and airports; the user must protect themselves (e.g. VPN)</td></tr>
<tr><td><b>WEP</b></td><td>Original; RC4 with a static key; broken, never use it</td></tr>
<tr><td><b>WPA</b></td><td>TKIP (changes the key for each packet); interim fix on old hardware</td></tr>
<tr><td><b>WPA2</b></td><td><b>AES</b> with CCMP; strong, but older WPA2-Personal can be attacked by offline guessing of the password</td></tr>
<tr><td><b>WPA3</b></td><td>Latest; see below</td></tr>
</table>
<p><b>Personal mode:</b> a <b>pre-shared key (PSK)</b> for homes and small offices. <b>Enterprise mode:</b> each user authenticates with <b>802.1X / EAP</b> through a <b>RADIUS</b> server (UDP 1812 authentication, 1813 accounting).</p>
<h4>WPA3 improvements</h4>
<ul>
<li><b>WPA3-Personal:</b> replaces the PSK handshake with <b>SAE</b> (Simultaneous Authentication of Equals), which resists brute-force and offline dictionary attacks and gives <b>forward secrecy</b> (⚠: past sessions stay safe even if the password is later learned).</li>
<li><b>WPA3-Enterprise:</b> 802.1X/EAP with a <b>192-bit</b> cryptographic suite; no mixing with older protocols.</li>
<li><b>Open networks:</b> <b>OWE</b> (Opportunistic Wireless Encryption) encrypts traffic even without a password.</li>
<li><b>IoT onboarding:</b> <b>DPP</b> (Device Provisioning Protocol) to join devices that have no screen.</li>
<li>Requires <b>Protected Management Frames (PMF)</b>, which stops forged "disconnect" frames.</li>
</ul>
<h4>Rogue AP detection and wireless intrusion detection (⚠ beyond the slides)</h4>
<p>A <b>WIDS / WIPS</b> (wireless intrusion detection / prevention system) listens to the radio spectrum, using APs or sensors. It detects <b>rogue APs</b> and <b>evil twins</b> (unknown APs, or known SSIDs from unknown MACs), <b>deauthentication floods</b>, jamming, and unusual clients; a WIPS can also block them. In the college slides: configure the WLC with <b>rogue AP policies</b>, authenticate all devices, and monitor for abnormal devices and traffic. Other good practice: WPA3 or WPA2-Enterprise, strong passwords, firmware updates, turn off WPS, separate guest network.</p>

</ul>

<h3>7.1 Security principles</h3>
<p>Network security protects the <b>network infrastructure</b> (physical security of devices, preventing unauthorised access to them) and the <b>information</b> sent over it. It matters for every network, whatever its size, and must still allow the quality of service users expect (college slides).</p>
<h4>The CIA triad</h4>
<table>
<tr><th>Goal</th><th>Meaning</th><th>Threatened by</th><th>Protected by</th></tr>
<tr><td><b>Confidentiality</b></td><td>Only the intended recipients can read the data</td><td>Eavesdropping, data theft</td><td>Encryption, access control</td></tr>
<tr><td><b>Integrity</b></td><td>Data has not been altered in transit or storage</td><td>Tampering, man-in-the-middle</td><td>Hashes, digital signatures, checksums</td></tr>
<tr><td><b>Availability</b></td><td>Authorised users can reach data and services when needed</td><td>Denial of service, failures</td><td>Redundancy, backups, DoS protection</td></tr>
</table>
<p>⚠ Often added: <b>authentication</b> (proving who you are), <b>authorisation</b> (what you may do), <b>accounting</b> (keeping a record) (AAA), and <b>non-repudiation</b> (a sender cannot deny having sent a message).</p>
<h4>Threats (college slides, plus ⚠ extra)</h4>
<ul>
<li><b>External threats:</b> viruses, worms and Trojan horses; spyware and adware; <b>zero-day attacks</b> (unknown flaw, no patch yet); threat-actor attacks; <b>denial of service</b>; data interception and theft; identity theft.</li>
<li><b>Internal threats:</b> lost or stolen devices, accidental misuse by employees, malicious employees.</li>
<li>⚠ <b>Passive attacks</b> only listen (eavesdropping, traffic analysis) and are hard to detect. <b>Active attacks</b> change or disrupt: <b>masquerading / spoofing</b>, <b>replay</b>, <b>modification</b>, <b>denial of service</b>.</li>
<li>⚠ <b>Common network attacks:</b> packet sniffing; ARP, DNS and IP spoofing; man-in-the-middle; <b>phishing</b> (fake messages to steal credentials); port scanning; <b>DoS and DDoS</b> (many compromised machines flood a target); <b>SYN flood</b> (an attacker sends many SYN segments and never completes the handshake, filling the server's table of half-open connections; defence: SYN cookies, rate limiting).</li>
</ul>
<h4>Threat models (⚠)</h4>
<p>A <b>threat model</b> is a structured way to ask: what are we protecting (assets), who might attack (attackers and their abilities), how (attack paths), and what do we do about it. A common checklist is <b>STRIDE</b>:</p>
<table>
<tr><th>Threat</th><th>Violates</th><th>Example</th></tr>
<tr><td><b>S</b>poofing</td><td>Authentication</td><td>Fake login page, forged sender address</td></tr>
<tr><td><b>T</b>ampering</td><td>Integrity</td><td>Changing an amount in a transfer</td></tr>
<tr><td><b>R</b>epudiation</td><td>Non-repudiation</td><td>Denying that a payment was made</td></tr>
<tr><td><b>I</b>nformation disclosure</td><td>Confidentiality</td><td>Sniffing an unencrypted connection</td></tr>
<tr><td><b>D</b>enial of service</td><td>Availability</td><td>Flooding a web server</td></tr>
<tr><td><b>E</b>levation of privilege</td><td>Authorisation</td><td>A normal user gains admin rights</td></tr>
</table>
<p>The attacker may be an outsider on the internet, a user on the same Wi-Fi, a malicious insider, or a compromised device; the model sets what each can do (watch, change, block traffic).</p>
<h4>Defense mechanisms</h4>
<p>Security must be <b>layered</b> ("<b>defense in depth</b>"): no single tool is enough (college slides). Home or small office: <b>antivirus and antispyware</b> on end devices and a <b>firewall</b>. Larger networks add a dedicated firewall, <b>access control lists (ACLs)</b>, <b>intrusion prevention systems (IPS)</b> and <b>virtual private networks (VPNs)</b>. ⚠ More: strong authentication (passwords, <b>multi-factor authentication</b>), <b>encryption</b>, <b>patching</b>, backups, physical security, logging and monitoring, user training.</p>
<h4>Network security policy and procedures (⚠; asked in 2018)</h4>
<p>A <b>security policy</b> is a written statement of what must be protected and the rules everyone follows; <b>procedures</b> are the step-by-step instructions that carry it out. Typical contents for an organisation:</p>
<ul>
<li><b>Acceptable use policy:</b> what staff may do with systems and the internet.</li>
<li><b>Access control and password policy:</b> least privilege, strong passwords, MFA, removing access when staff leave.</li>
<li><b>Data classification and protection:</b> public, internal, confidential; encryption rules.</li>
<li><b>Network and remote access:</b> firewall rules, VPN, wireless security, guest network.</li>
<li><b>Patch and change management:</b> keep software updated; approve changes.</li>
<li><b>Backup and disaster recovery:</b> regular backups, tested restores.</li>
<li><b>Incident response:</b> who does what when a breach happens: detect, contain, eradicate, recover, review.</li>
<li><b>Training and awareness; audit and review</b> of the policy.</li>
</ul>

<h3>7.2 Cryptographic techniques (⚠ not in the college slides)</h3>
<p><b>Cryptography</b> hides information. <b>Plaintext</b> is turned into <b>ciphertext</b> by <b>encryption</b> using a <b>key</b>; <b>decryption</b> reverses it. A modern cipher is public; only the <b>key</b> is secret (Kerckhoffs's principle). Security grows with key length: every extra key bit doubles the number of keys to try (<b>brute force</b>).</p>
<p class="ex"><b>Classic example (Caesar cipher):</b> shift every letter by 3. HELLO becomes <b>KHOOR</b>. Only 25 possible keys, so it is trivial to break.</p>
<h4>Symmetric-key encryption</h4>
<p>The <b>same key</b> encrypts and decrypts. It is <b>fast</b>, used for the bulk data. Problem: how do two parties share the key safely, and how many keys are needed: for n users each pair needs its own key, <b>n(n − 1)/2</b>; 10 users need 45 keys.</p>
<ul>
<li><b>DES:</b> 64-bit blocks, <b>56-bit</b> key: too small now. <b>3DES</b> applies it three times (about 112-bit effective security), slow and being retired.</li>
<li><b>AES</b> (Advanced Encryption Standard, Rijndael): the current standard. <b>128-bit block</b>; key of <b>128, 192 or 256 bits</b> (10, 12 or 14 rounds). Fast in hardware. Used in WPA2, TLS and IPsec. Block ciphers need a <b>mode</b> (e.g. CBC or GCM); ECB mode leaks patterns.</li>
<li><b>RC4</b> is a stream cipher (used in WEP and old TLS); now considered insecure.</li>
</ul>
<h4>Asymmetric (public-key) encryption</h4>
<p>Each user has a <b>key pair</b>: a <b>public key</b> (shared with everyone) and a <b>private key</b> (kept secret). What one key encrypts, only the other decrypts. To send a secret to Bob, encrypt with <b>Bob's public key</b>; only Bob's private key can decrypt. It solves key distribution (n users need only 2n keys: 20 for 10 users), but is <b>slow</b>, so it is used to exchange a symmetric key.</p>
<p><b>RSA</b> (Rivest, Shamir, Adleman): security rests on how hard it is to <b>factor</b> a large number n = p × q. Steps: (1) choose two primes p and q; (2) n = p × q; (3) φ = (p − 1)(q − 1); (4) choose e with 1 &lt; e &lt; φ and gcd(e, φ) = 1; (5) d is the inverse of e modulo φ (e × d mod φ = 1). Public key (e, n); private key (d, n). <b>Encrypt:</b> c = m<sup>e</sup> mod n. <b>Decrypt:</b> m = c<sup>d</sup> mod n.</p>
<p class="ex"><b>RSA worked example 1.</b> p = 3, q = 11. n = 33, φ = 2 × 10 = 20. Choose e = 7 (gcd(7, 20) = 1). d = 3 because 7 × 3 = 21 and 21 mod 20 = 1. Message m = 4: c = 4<sup>7</sup> mod 33 = 16384 mod 33 = <b>16</b>. Decrypt: 16<sup>3</sup> mod 33 = 4096 mod 33 = <b>4</b>. ✓<br>
<b>RSA worked example 2.</b> p = 5, q = 11. n = 55, φ = 40, e = 3, d = 27 (3 × 27 = 81, 81 mod 40 = 1). m = 9: c = 9<sup>3</sup> mod 55 = 729 mod 55 = <b>14</b>; decrypting 14<sup>27</sup> mod 55 gives back <b>9</b>. (Real RSA uses primes hundreds of digits long: keys of 2,048 bits or more.)</p>
<p><b>Diffie-Hellman key exchange:</b> two parties agree on a shared secret over an open channel. <span class="ex">Public: p = 23, g = 5. Alice picks secret a = 6, sends A = 5<sup>6</sup> mod 23 = <b>8</b>. Bob picks b = 15, sends B = 5<sup>15</sup> mod 23 = <b>19</b>. Alice computes 19<sup>6</sup> mod 23 = <b>2</b>; Bob computes 8<sup>15</sup> mod 23 = <b>2</b>. Shared key = 2.</span> An eavesdropper sees p, g, 8 and 19 but cannot easily find the secret.</p>
<table>
<tr><th></th><th>Symmetric (AES)</th><th>Asymmetric (RSA)</th></tr>
<tr><td>Keys</td><td>One shared secret key</td><td>Public + private key pair</td></tr>
<tr><td>Speed</td><td>Fast</td><td>Slow (hundreds of times)</td></tr>
<tr><td>Key distribution</td><td>Hard</td><td>Easy (public key can be open)</td></tr>
<tr><td>Typical use</td><td>Encrypting bulk data</td><td>Key exchange, digital signatures, certificates</td></tr>
</table>
<p><b>Hybrid encryption:</b> use RSA (or Diffie-Hellman) to agree a short-lived <b>session key</b>, then AES for the data. This is how TLS and PGP work.</p>
<h4>Hash functions and digital signatures</h4>
<p>A <b>hash function</b> turns any input into a fixed-length <b>digest</b>: one-way (cannot be reversed), a tiny change in input changes the output completely, and it is hard to find two inputs with the same digest (collision-resistant). <b>SHA-256</b> gives a 256-bit digest; MD5 and SHA-1 are broken. An <b>HMAC</b> is a hash with a shared secret key, giving integrity and authentication.</p>
<p>A <b>digital signature</b> proves who sent a message and that it was not changed:</p>
<ol>
<li>The sender hashes the message.</li>
<li>The sender encrypts the hash with the <b>sender's private key</b>: that is the signature.</li>
<li>The receiver decrypts the signature with the sender's <b>public key</b> and hashes the received message.</li>
<li>If the two hashes match: the message is <b>authentic</b> (only the private-key holder could sign), has <b>integrity</b>, and the signer cannot deny it (<b>non-repudiation</b>). A signature alone does <b>not</b> hide the message (no confidentiality).</li>
</ol>
<p>A <b>digital certificate</b> (X.509), issued by a <b>certificate authority (CA)</b>, binds a public key to an identity (such as a bank's domain name), so you know the public key really belongs to it.</p>
<h4>TLS / SSL</h4>
<p><b>TLS</b> (Transport Layer Security, successor to <b>SSL</b>) secures TCP connections between a client and a server. <b>HTTPS = HTTP over TLS</b> (port 443). SSL 2.0/3.0 are obsolete and insecure; use TLS 1.2 or 1.3. It gives <b>confidentiality</b> (encryption), <b>integrity</b> (a MAC on every record) and <b>server authentication</b> (certificate). Handshake (simplified):</p>
<ol>
<li><b>ClientHello:</b> supported versions and cipher suites, a random number.</li>
<li><b>ServerHello + certificate:</b> the chosen suite and the server's certificate (public key, signed by a CA).</li>
<li>The client <b>checks the certificate</b> (trusted CA, domain name, not expired).</li>
<li><b>Key exchange</b> (e.g. ephemeral Diffie-Hellman, ECDHE): both sides compute the same <b>session keys</b>; the ephemeral exchange gives <b>forward secrecy</b>.</li>
<li><b>Finished</b> messages confirm the handshake; the rest of the session is encrypted with a <b>symmetric</b> cipher (AES).</li>
</ol>
<p>TLS 1.3 needs one round trip for its handshake (TLS 1.2 needs two), on top of the TCP handshake. TLS protects online banking: the certificate proves you are talking to the real bank, the keys are agreed securely, and AES encrypts the account data, so a sniffer sees only ciphertext.</p>
<h4>PGP and other protocols (⚠)</h4>
<p><b>PGP</b> secures email with the hybrid method: the message is <b>signed</b> with the sender's private key, <b>compressed and encrypted with a random session key</b> (AES), and the session key is encrypted with the <b>recipient's public key</b>. Trust uses a <b>web of trust</b> (users sign each other's keys). <b>IPsec</b> (network layer, see Unit 4) and <b>WPA2/WPA3</b> (wireless, see Unit 6) apply the same ideas at other layers.</p>

<h3>7.3 Network defense</h3>
<h4>Firewalls</h4>
<p>A <b>firewall</b> is a device or software that <b>filters traffic between networks</b> (usually inside and outside) according to rules, blocking unauthorised access (college slides). Best practice: <b>default deny</b> (block everything not explicitly allowed). Uses (⚠): control what enters and leaves, hide and protect internal hosts (with NAT), log traffic, enforce policy, and end VPN tunnels.</p>
<table>
<tr><th>Type</th><th>How it works</th><th>Pros and cons</th></tr>
<tr><td><b>Packet filtering</b> (stateless; ACLs)</td><td>Checks each packet alone: source/destination IP, protocol, port</td><td>Fast and simple; does not understand connections or content</td></tr>
<tr><td><b>Stateful inspection</b></td><td>Tracks connections; allows replies to requests made from inside</td><td>More secure; uses more memory</td></tr>
<tr><td><b>Application gateway (proxy)</b></td><td>Works at the application layer; the client talks to the proxy, which talks to the server and can inspect the content (HTTP, FTP)</td><td>Deepest checking; slower</td></tr>
<tr><td><b>Next-generation firewall</b> ⚠</td><td>Adds application awareness, IPS, user identity</td><td>Strong; costly</td></tr>
</table>
<p class="ex"><b>Example rules.</b> Allow TCP to 203.0.113.10 port 443 (HTTPS to the web server). Allow replies to established connections. Deny everything else (default deny). A <b>DMZ</b> (demilitarised zone) ⚠ is a separate network segment for public servers, so that a compromise of the web server does not give direct access to the internal LAN.</p>
<p>Limits: a firewall does not stop attacks from inside, cannot inspect encrypted traffic without extra setup, and cannot stop malware that arrives through allowed ports.</p>
<h4>IDS and IPS</h4>
<ul>
<li><b>IDS</b> (intrusion detection system): <b>monitors</b> traffic or logs and <b>raises alerts</b>; it sits beside the traffic and does not block it.</li>
<li><b>IPS</b> (intrusion prevention system): sits <b>inline</b> and can <b>block or drop</b> malicious traffic automatically.</li>
<li><b>Network-based (NIDS/NIPS)</b> watch the network; <b>host-based (HIDS)</b> watch one computer.</li>
<li><b>Signature-based</b> detection matches known attack patterns (accurate, misses new attacks); <b>anomaly-based</b> detection flags unusual behaviour (can find new attacks, more <b>false positives</b>).</li>
</ul>
<h4>VPN (virtual private network)</h4>
<p>A VPN builds an <b>encrypted tunnel</b> across a public network such as the internet, so the traffic is private as if on a private line. It gives confidentiality, integrity and authentication. Types: <b>remote-access VPN</b> (one user to the company network) and <b>site-to-site VPN</b> (office to office). Technologies: <b>IPsec</b> (network layer; AH and ESP, tunnel mode), <b>SSL/TLS VPN</b> (through a browser or client), and ⚠ OpenVPN, WireGuard. Benefits: cheaper than leased lines, secure remote working. Weakness: once connected, a user may get broad access to the internal network.</p>
<h4>Zero trust architecture</h4>
<p>The old model was a <b>perimeter</b> ("castle and moat"): trust everything inside the network. <b>Zero trust</b> says <b>"never trust, always verify"</b>: no user, device or network location is trusted automatically, even inside. Principles (⚠):</p>
<ul>
<li><b>Verify explicitly:</b> authenticate and authorise every request using identity, device health, location and context; use <b>multi-factor authentication</b>.</li>
<li><b>Least privilege:</b> give only the access needed, only for as long as needed.</li>
<li><b>Assume breach:</b> design as if attackers are already inside: <b>micro-segmentation</b> (small isolated zones), encrypt all traffic, log and monitor everything, continuous checks.</li>
</ul>
<p><b>How zero trust, VPN and IDS/IPS fit together:</b> the VPN carries remote traffic securely but, under zero trust, access after the tunnel is <b>limited per user and application</b> (zero trust network access); the IDS/IPS inspects the traffic <b>inside</b> the segments to find and block threats from outsiders and from compromised insiders; the firewall enforces the micro-segment rules; identity and device checks decide who gets through. Together they cover both external and internal threats.</p>

<p class="tip">⚠ The college slides have no network-management chapter. This whole unit is written from standard networking knowledge, so check the details against what the lecturer teaches. Facts that match the college material: SNMP is an application-layer protocol that uses UDP port 161 (Unit 3 port table), and traffic analysers such as MRTG, PRTG, SNMP, Packet Tracer and Wireshark are named in the older course outline.</p>
<h3>8.1 Network management framework</h3>
<p><b>Network management</b> is everything done to keep a network running well: <b>monitoring</b> it, <b>configuring</b> it, finding and fixing <b>faults</b>, tracking <b>performance</b>, controlling <b>security</b> and recording <b>usage</b>. The standard way to organise the tasks is <b>FCAPS</b> (ISO model):</p>
<table>
<tr><th>Area</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>F</b>ault management</td><td>Detect, isolate and fix problems</td><td>Alarm when a link goes down</td></tr>
<tr><td><b>C</b>onfiguration management</td><td>Set up devices; keep and track configurations</td><td>Back up router configurations</td></tr>
<tr><td><b>A</b>ccounting management</td><td>Record usage, for billing or quotas</td><td>Data used per customer</td></tr>
<tr><td><b>P</b>erformance management</td><td>Measure and tune performance</td><td>Utilisation, delay, loss</td></tr>
<tr><td><b>S</b>ecurity management</td><td>Control access and detect misuse</td><td>Log failed logins</td></tr>
</table>
<h4>Management architecture</h4>
<svg viewBox="0 0 560 150" class="dg" role="img" aria-label="SNMP manager and agents">
<rect x="10" y="40" width="150" height="70" rx="8" class="box"/><text x="85" y="66" class="t">Manager (NMS)</text><text x="85" y="84" class="ts">network management</text><text x="85" y="98" class="ts">station</text>
<rect x="390" y="10" width="160" height="50" rx="8" class="box"/><text x="470" y="32" class="t">Agent: router</text><text x="470" y="48" class="ts">MIB (data)</text>
<rect x="390" y="90" width="160" height="50" rx="8" class="box"/><text x="470" y="112" class="t">Agent: switch</text><text x="470" y="128" class="ts">MIB (data)</text>
<line x1="160" y1="60" x2="390" y2="35" class="ln"/><line x1="160" y1="90" x2="390" y2="115" class="ln"/>
<text x="275" y="40" class="ts">GET / SET (UDP 161) →</text><text x="275" y="112" class="ts">← response, TRAP (UDP 162)</text>
</svg>
<p>A <b>manager</b> (the network management station, NMS) talks to <b>agents</b> running on managed devices (routers, switches, servers, printers). Each agent keeps information in a <b>MIB</b> (Management Information Base).</p>
<h4>SNMP (Simple Network Management Protocol)</h4>
<p><b>SNMP</b> is the most widely used <b>application-layer protocol for monitoring and managing network devices</b>. It lets the manager <b>read</b> status and counters from devices, <b>change</b> settings, and receive <b>alerts</b>. It runs over <b>UDP</b>: the agent listens on port <b>161</b> and the manager receives traps on port <b>162</b>.</p>
<ul>
<li><b>MIB:</b> a tree-structured database of managed objects (interface status, bytes in and out, CPU load, uptime). Each object has a unique <b>OID</b> (object identifier) such as 1.3.6.1.2.1.1.1.0, which is <b>sysDescr</b>, the device description.</li>
<li><b>Operations:</b> <b>GET</b> (read one object), <b>GETNEXT</b> and <b>GETBULK</b> (walk the tree), <b>SET</b> (change a value), <b>RESPONSE</b> (the agent's answer), <b>TRAP</b> and <b>INFORM</b> (the agent reports an event on its own, e.g. a link went down; INFORM is acknowledged).</li>
<li><b>Polling vs traps:</b> the manager <b>polls</b> devices at intervals to build trends (a 5-minute poll gives 288 samples a day per object); traps give <b>instant</b> alerts without waiting for the next poll.</li>
<li><b>Versions:</b> <b>SNMPv1</b> and <b>v2c</b> use a <b>community string</b> (like a password) sent in <b>plain text</b>, so they are insecure; <b>SNMPv3</b> adds <b>authentication</b> and <b>encryption</b> (security levels noAuthNoPriv, authNoPriv, authPriv) and user-based access, so use v3.</li>
</ul>
<h4>Network monitoring tools</h4>
<table>
<tr><th>Tool / method</th><th>What it does</th></tr>
<tr><td><b>ping and traceroute</b></td><td>Test reachability and show the path (ICMP; Unit 4)</td></tr>
<tr><td><b>SNMP-based monitors</b>: <b>MRTG</b>, <b>PRTG</b>, Nagios, Zabbix</td><td>Poll devices over SNMP and draw graphs of traffic, CPU, uptime; send alerts (MRTG and PRTG are named in the college outline)</td></tr>
<tr><td><b>Wireshark</b> (packet analyser)</td><td>Captures packets and decodes protocols, to see exactly what crosses the network; good for troubleshooting and for security analysis</td></tr>
<tr><td><b>Cisco Packet Tracer</b></td><td>A simulator for building and testing networks (a learning tool, not a production monitor)</td></tr>
<tr><td><b>Syslog</b></td><td>Devices send log messages to a log server (UDP 514). Severity levels 0 to 7: emergency, alert, critical, error, warning, notice, informational, debug</td></tr>
<tr><td><b>NetFlow / IPFIX</b></td><td>Records <b>flows</b> (who talked to whom, how much, which ports) to see traffic patterns</td></tr>
<tr><td><b>NTP</b></td><td>Keeps device clocks in step (UDP 123), so logs from different devices line up</td></tr>
</table>
<h4>Traffic analysis</h4>
<p><b>Traffic analysis</b> studies the traffic crossing the network: how much (<b>utilisation</b>), of what kind (web, video, email), between whom (top talkers), and when (peak hours).</p>
<ul>
<li>Key <b>metrics:</b> utilisation, throughput, latency, jitter, packet loss, error rate, availability.</li>
<li><b>Baseline:</b> record what is normal; a deviation (sudden spike, unusual port) may mean a fault, congestion or an attack.</li>
<li>Uses: <b>capacity planning</b> (when to upgrade), <b>troubleshooting</b>, <b>QoS</b> design, <b>security</b> (spotting DDoS, malware, data leaks), and <b>billing</b>.</li>
</ul>
<p class="ex"><b>Utilisation example.</b> 30 Mbps of traffic on a 100 Mbps link: utilisation = 30 / 100 = <b>30%</b>.<br>
<b>Availability example.</b> Availability = MTBF / (MTBF + MTTR) (mean time between failures, mean time to repair). MTBF = 990 h and MTTR = 10 h give 990 / 1000 = <b>99.0%</b>. Downtime per year: 99% = 87.6 hours, 99.9% = 8.76 hours, 99.99% = 52.6 minutes, 99.999% = 5.26 minutes.</p>

<h3>8.2 Emerging trends</h3>
<h4>Traditional management and its limits</h4>
<p>Traditionally an administrator types commands (CLI) on each device, watches for alarms and reacts after something breaks. This is slow, error-prone and does not scale to thousands of devices, cloud services and mobile users.</p>
<h4>Intent-based networking (IBN)</h4>
<p>In IBN the administrator states the desired <b>business intent</b> in plain, high-level terms (for example "the finance department must be isolated from guests, and video calls must get priority") and the network works out how to do it. A closed loop with three functions:</p>
<ol>
<li><b>Translation:</b> turn the intent into policies and device-level configuration.</li>
<li><b>Activation (automation):</b> push the configuration to all the devices, automatically and consistently.</li>
<li><b>Assurance:</b> continuously collect telemetry, check that the network really behaves as intended, and <b>fix or alert</b> when it does not.</li>
</ol>
<h4>AI and machine learning in network management</h4>
<p><b>Machine learning</b> learns patterns from telemetry data, which the network produces in huge amounts. Uses and how they beat the traditional approach:</p>
<table>
<tr><th>Area</th><th>Traditional</th><th>With AI / ML</th></tr>
<tr><td><b>Performance</b></td><td>Fixed thresholds on graphs</td><td>Learns the normal baseline for each link and time of day; forecasts traffic for capacity planning</td></tr>
<tr><td><b>Fault detection</b></td><td>Alarm after failure; engineer looks for the cause</td><td>Predicts failures (e.g. a failing optic) early; correlates alarms and suggests the <b>root cause</b></td></tr>
<tr><td><b>Decision-making</b></td><td>Manual, rule by rule</td><td>Recommends or applies changes (re-routing, QoS tuning) automatically</td></tr>
<tr><td><b>Security</b></td><td>Signature-based alerts</td><td>Anomaly detection finds unusual behaviour and new threats</td></tr>
</table>
<p>This is often called <b>AIOps</b>. Needs good data; models can be wrong, so humans keep oversight.</p>
<h4>Network automation</h4>
<p>Replacing manual steps by software: <b>scripts</b> and tools (for example Ansible), <b>APIs</b> (REST) and standard models and protocols (<b>NETCONF with YANG</b>) to configure devices; <b>infrastructure as code</b> (configurations kept as versioned files); <b>streaming telemetry</b> (devices push data continuously, more detailed than SNMP polling every few minutes); and <b>self-healing</b> responses. Benefits: speed, consistency, fewer mistakes, lower cost. Works hand in hand with SDN (Unit 4) and IBN.</p>

<h3>Exam checklist, Unit 8</h3>
<ul>
<li>FCAPS; manager, agent, MIB, OID; SNMP operations; ports 161 and 162; versions (v3 is secure).</li>
<li>Monitoring tools: ping, MRTG/PRTG, Wireshark, Packet Tracer, syslog, NetFlow, NTP.</li>
<li>Traffic analysis: metrics, baseline, uses; utilisation and availability calculations.</li>
<li>Intent-based networking (translation, activation, assurance); AI/ML uses; automation.</li>
</ul>
`,

    { id: "u8q27", q: "In intent-based networking, the administrator specifies", o: ["Desired business outcomes in high-level terms", "Each CLI command", "Only IP addresses", "Only VLAN numbers"], a: 0, why: "The network translates the intent into configuration.", w: 3 },

    { id: "u8q30", q: "How can AI/ML improve fault detection over traditional management?", o: ["It predicts failures and finds root causes by correlating alarms", "It removes the need for any data", "It makes cables faster", "It replaces IP addresses"], a: 0, why: "Traditional methods react after failure.", w: 3 },
    { id: "u8q31", q: "An AI/ML anomaly detector finds attacks by", o: ["Spotting behaviour that differs from the learned normal", "Matching only known signatures", "Blocking all ports", "Deleting logs"], a: 0, why: "It can find new threats, but may give false positives.", w: 2 },
    { id: "u8q32", q: "Streaming telemetry differs from SNMP polling because the device", o: ["Pushes data continuously", "Waits to be asked every 5 minutes", "Sends only traps", "Uses plain-text community strings"], a: 0, why: "More detailed and timely.", w: 2 },
    { id: "u8q33", q: "NETCONF/YANG and REST APIs are used for", o: ["Automated device configuration", "Drawing graphs only", "Cable testing", "Playing video"], a: 0, why: "Network automation.", w: 2 },
    { id: "u8q34", q: "Infrastructure as code means", o: ["Keeping network configurations as versioned, automatable files", "Writing a book", "Building with bricks", "Encrypting the code"], a: 0, why: "Consistent and repeatable changes.", w: 1 },

<script>
"use strict";
/* ---------- storage (always wrapped: may be blocked) ---------- */
var KEY="bcs_study_v1", mem=null;
function load(){ if(mem) return mem; var o=null; try{ o=JSON.parse(localStorage.getItem(KEY)); }catch(e){} mem=o||{items:{},log:[],fmt:"new",written:{}}; return mem; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }
var DAY=86400000, INT=[0,1,3,7,14,30];
function st(id){ var s=load(); return s.items[id]||(s.items[id]={box:0,due:0,r:0,w:0,seen:0}); }
function record(id,ok,unit){ var s=st(id); s.seen++; if(ok){s.r++; s.box=Math.min(5,s.box+1);} else {s.w++; s.box=0;} s.due=Date.now()+(ok?INT[s.box]:INT[1])*DAY; load().log.push({t:Date.now(),id:id,ok:ok,u:unit}); if(load().log.length>3000) load().log.shift(); save(); }

/* ---------- content access ---------- */
function units(){ return (window.CNW.units||[]).filter(Boolean); }
function allQuiz(){ var a=[]; units().forEach(function(u,i){ (u.quiz||[]).forEach(function(q){ a.push(Object.assign({unit:i},q)); }); }); return a; }
function allExam(type){ var a=[]; units().forEach(function(u,i){ (u.exam||[]).forEach(function(q){ if(!type||q.type===type) a.push(Object.assign({unit:i},q)); }); }); return a; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function view(q){ var idx=shuffle(q.o.map(function(_,i){return i;})); return {opts:idx.map(function(i){return q.o[i];}), a:idx.indexOf(q.a)}; }

/* ---------- shell ---------- */
var TABS=[["home","Today"],["study","Notes"],["quiz","Quiz"],["written","Written"],["mock","Mock exam"],["progress","Progress"]];
var cur="home", app=document.getElementById("app");
function nav(){ var n=document.getElementById("nav"); n.innerHTML=""; TABS.forEach(function(t){ var b=document.createElement("button"); b.textContent=t[1]; if(t[0]===cur) b.className="on"; b.onclick=function(){go(t[0]);}; n.appendChild(b); }); }
function go(t){ cur=t; nav(); window.scrollTo(0,0); ({home:home,study:study,quiz:quizMenu,written:writtenMenu,mock:mockMenu,progress:progress})[t](); }
function el(html){ app.innerHTML=html; }

/* ---------- Today ---------- */
function dueItems(){ var now=Date.now(); return allQuiz().filter(function(q){ var s=load().items[q.id]; return s && s.due<=now && s.seen>0; }); }
function newItems(){ return allQuiz().filter(function(q){ return !load().items[q.id]; }); }
function home(){
  var due=dueItems(), nw=newItems(), total=allQuiz().length, s=load();
  var today=s.log.filter(function(l){ return Date.now()-l.t<DAY; });
  var ok=today.filter(function(l){return l.ok;}).length;
  el('<h2>Today</h2><div class="card"><div class="mu">Review due</div><div class="big">'+due.length+'</div><div class="mu">'+nw.length+' new questions waiting · '+total+' in the bank</div><div class="row" style="margin-top:10px"><button class="b p" id="go">'+(due.length+nw.length?'Start today\'s session':'Nothing due')+'</button></div></div>'+
  '<div class="card"><div class="mu">Answered in the last 24 hours</div><div class="big">'+today.length+'</div><div class="mu">'+(today.length?Math.round(100*ok/today.length)+'% correct':'No answers yet')+'</div></div>'+
  '<div class="card"><b>How this works</b><p class="mu">A question you get right returns after 1, 3, 7, 14 and then 30 days. A wrong answer comes back tomorrow. Testing yourself and spacing it out beat re-reading, so do the session first, then read notes for the topics you missed.</p></div>');
  var g=document.getElementById("go"); if(g) g.onclick=function(){ runQuiz(shuffle(due).concat(shuffle(nw).slice(0,Math.max(0,12-due.length))).slice(0,20),"Today's session"); };
}

/* ---------- Notes ---------- */
function study(){
  var h='<h2>Notes</h2><div class="card"><b>'+esc(window.CNW.code+" "+window.CNW.title)+'</b><p class="mu">Written in our own words from the college slides and syllabus. A ⚠ means the point is not in the college slides: check it before relying on it.</p></div>';
  units().forEach(function(u,i){ h+='<div class="card"><b>Unit '+(i+1)+': '+esc(u.title)+'</b><div class="mu">'+(u.quiz||[]).length+' quiz · '+(u.exam||[]).length+' written</div><div class="row" style="margin-top:8px"><button class="b p" data-u="'+i+'">Read notes</button><button class="b" data-q="'+i+'">Quiz this unit</button></div></div>'; });
  el(h); app.querySelectorAll("[data-u]").forEach(function(b){ b.onclick=function(){ readUnit(+b.dataset.u); }; }); app.querySelectorAll("[data-q]").forEach(function(b){ b.onclick=function(){ runQuiz(shuffle(units()[+b.dataset.q].quiz.map(function(q){return Object.assign({unit:+b.dataset.q},q);})),"Unit "+(+b.dataset.q+1)); }; });
}
function readUnit(i){ var u=units()[i]; el('<div class="row"><button class="b" id="back">← Notes</button></div><h2>Unit '+(i+1)+': '+esc(u.title)+'</h2><div class="card"><b>Syllabus wording</b><ul>'+u.syllabus.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div><div class="card notes">'+u.notes+'</div>'); document.getElementById("back").onclick=study; }

/* ---------- Quiz ---------- */
function quizMenu(){
  var h='<h2>Quiz</h2>';
  units().forEach(function(u,i){ h+='<div class="card row"><div style="flex:1"><b>Unit '+(i+1)+': '+esc(u.title)+'</b><div class="mu">'+(u.quiz||[]).length+' questions</div></div><button class="b p" data-q="'+i+'">Start</button></div>'; });
  h+='<div class="card row"><div style="flex:1"><b>Mixed: all units</b><div class="mu">'+allQuiz().length+' questions, 20 at random</div></div><button class="b p" id="mix">Start</button></div>';
  h+='<div class="card row"><div style="flex:1"><b>Weak spots</b><div class="mu">Questions you got wrong more than right</div></div><button class="b" id="weak">Start</button></div>';
  el(h);
  app.querySelectorAll("[data-q]").forEach(function(b){ b.onclick=function(){ var i=+b.dataset.q; runQuiz(shuffle(units()[i].quiz.map(function(q){return Object.assign({unit:i},q);})),"Unit "+(i+1)); }; });
  document.getElementById("mix").onclick=function(){ runQuiz(shuffle(allQuiz()).slice(0,20),"Mixed"); };
  document.getElementById("weak").onclick=function(){ var w=allQuiz().filter(function(q){ var s=load().items[q.id]; return s&&s.w>s.r; }); if(!w.length){ alert("No weak questions yet."); return; } runQuiz(shuffle(w),"Weak spots"); };
}
function runQuiz(list,title){
  if(!list.length){ alert("No questions available."); return; }
  var i=0,right=0,missed=[];
  function show(){
    var q=list[i], v=view(q), done=false;
    el('<div class="row"><button class="b" id="quit">✕ Quit</button><span class="mu">'+esc(title)+' · '+(i+1)+' / '+list.length+'</span></div><div class="bar" style="margin:8px 0"><i style="width:'+(100*i/list.length)+'%"></i></div><div class="card"><div>'+esc(q.q)+'</div><div id="opts"></div><div id="fb"></div></div>');
    document.getElementById("quit").onclick=function(){ if(i===0||confirm("Stop this quiz?")) go("quiz"); };
    var box=document.getElementById("opts");
    v.opts.forEach(function(t,k){ var b=document.createElement("button"); b.className="opt"; b.textContent=t; b.onclick=function(){
      if(done) return; done=true; var ok=(k===v.a); if(ok) right++; else missed.push(q);
      record(q.id,ok,q.unit); [].forEach.call(box.children,function(c,j){ if(j===v.a) c.classList.add("ok"); else if(j===k) c.classList.add("no"); c.disabled=true; });
      document.getElementById("fb").innerHTML='<div class="why"><b>'+(ok?"Correct.":"Not quite.")+'</b> '+esc(q.why)+'</div><div class="row" style="margin-top:10px"><button class="b p" id="next">'+(i+1<list.length?"Next":"Finish")+'</button></div>';
      document.getElementById("next").onclick=function(){ i++; if(i<list.length) show(); else finish(); };
    }; box.appendChild(b); });
  }
  function finish(){
    el('<h2>Done</h2><div class="card"><div class="big">'+right+' / '+list.length+'</div><div class="mu">'+Math.round(100*right/list.length)+'% correct</div></div>'+(missed.length?'<div class="card"><b>Missed</b><ul>'+missed.map(function(q){return '<li>'+esc(q.q)+'<div class="mu">'+esc(q.why)+'</div></li>';}).join("")+'</ul></div>':'')+'<div class="row"><button class="b p" id="again">Back</button></div>');
    document.getElementById("again").onclick=function(){ go("home"); };
  }
  show();
}

/* ---------- Written practice (self-marked against marking points) ---------- */
function ptNum(p){ var m=p.match(/\(\d+(\.\d+)?\)/g); return m?m.reduce(function(a,x){return a+parseFloat(x.slice(1,-1));},0):1; }
function writtenMenu(){
  var h='<h2>Written practice</h2><p class="mu">Write your answer from memory first, then tick the marking points you covered. This is the part that earns marks in a written exam.</p>';
  ["brief","short","long"].forEach(function(t){ var L=allExam(t); h+='<div class="card row"><div style="flex:1"><b>'+({brief:"Very short",short:"Short",long:"Long"}[t])+' questions</b><div class="mu">'+L.length+' questions</div></div><button class="b p" data-t="'+t+'">Practise</button></div>'; });
  el(h); app.querySelectorAll("[data-t]").forEach(function(b){ b.onclick=function(){ runWritten(shuffle(allExam(b.dataset.t))); }; });
}
function runWritten(list){
  if(!list.length){ alert("No questions yet."); return; }
  var i=0;
  function show(){
    var q=list[i], max=q.pts.reduce(function(a,p){return a+ptNum(p);},0);
    el('<div class="row"><button class="b" id="quit">✕ Back</button><span class="mu">'+(i+1)+' / '+list.length+'</span></div><div class="card">'+(q.real?'<span class="tag real">Seen in: '+esc(q.real)+'</span>':'')+'<p>'+esc(q.q)+'</p><textarea id="ans" placeholder="Write your answer here, from memory…"></textarea><div class="row" style="margin-top:8px"><button class="b p" id="rev">Show marking points</button></div><div id="mk"></div></div>');
    document.getElementById("quit").onclick=function(){ go("written"); };
    document.getElementById("rev").onclick=function(){
      document.getElementById("rev").disabled=true;
      var h='<p class="mu">Tick what your answer covered:</p>'+q.pts.map(function(p,k){ return '<label class="pt"><input type="checkbox" data-k="'+k+'"><span>'+esc(p)+'</span></label>'; }).join("")+'<div class="why" id="sc">Score: 0 / '+max+'</div><div class="row" style="margin-top:10px"><button class="b p" id="nx">'+(i+1<list.length?"Next":"Finish")+'</button></div>';
      document.getElementById("mk").innerHTML=h;
      function upd(){ var s=0; app.querySelectorAll("#mk input").forEach(function(c){ if(c.checked) s+=ptNum(q.pts[+c.dataset.k]); }); document.getElementById("sc").textContent="Score: "+s+" / "+max; return s; }
      app.querySelectorAll("#mk input").forEach(function(c){ c.onchange=upd; });
      document.getElementById("nx").onclick=function(){ var s=upd(); load().written[q.id]={s:s,max:max,t:Date.now()}; save(); i++; if(i<list.length) show(); else go("written"); };
    };
  }
  show();
}

/* ---------- Mock exam ---------- */
var FMT={
  "new":{name:"New format (BS 2082 model papers)",secs:[{n:"A",t:"brief",pick:10,off:10,m:2,l:"Very short answers: attempt all"},{n:"B",t:"short",pick:5,off:6,m:7,l:"Descriptive: attempt any 5 of 6"},{n:"C",t:"long",pick:3,off:4,m:15,l:"Essay: attempt any 3 of 4"}]},
  "old":{name:"Old format (2018 to 2025 papers)",secs:[{n:"A",t:"mcq",pick:30,off:30,m:1,l:"MCQ: attempt all 30"},{n:"B",t:"short",pick:5,off:8,m:6,l:"Short answers: attempt any 5 of 8"},{n:"C",t:"long",pick:2,off:3,m:20,l:"Long answers: attempt any 2 of 3"}]}
};
function mockMenu(){
  var f=load().fmt;
  el('<h2>Mock exam</h2><div class="card"><b>Format</b><p class="mu">Both formats exist in the college papers. Which one the Semester 1 exam uses is not confirmed yet. Ask the lecturer.</p><select id="fmt"><option value="new">'+FMT["new"].name+'</option><option value="old">'+FMT.old.name+'</option></select><p class="mu" id="fd"></p><div class="row"><button class="b p" id="start">Build a mock paper</button></div></div><div id="res"></div>');
  var sel=document.getElementById("fmt"); sel.value=f;
  function desc(){ var F=FMT[sel.value]; document.getElementById("fd").textContent=F.secs.map(function(s){return "Section "+s.n+": "+s.l+" ("+s.pick+" × "+s.m+" = "+(s.pick*s.m)+")";}).join(" · "); }
  sel.onchange=function(){ load().fmt=sel.value; save(); desc(); }; desc();
  document.getElementById("start").onclick=function(){ runMock(FMT[sel.value]); };
}
function runMock(F){
  var secs=F.secs.map(function(s){ var pool=s.t==="mcq"?shuffle(allQuiz()):shuffle(allExam(s.t)); return {s:s,items:pool.slice(0,s.off)}; });
  var avail=secs.reduce(function(a,x){return a+Math.min(x.s.pick,x.items.length)*x.s.m;},0);
  var h='<div class="row"><button class="b" id="q">✕ Back</button><span class="mu" id="clock">Time left 3:00:00</span></div><h2>Mock paper</h2><div class="card mu">'+esc(F.name)+'. Only the units built so far can appear, so this paper has '+avail+' of 100 marks available. Write each answer on paper or in the box, then self-mark against the marking points.</div>';
  secs.forEach(function(x,si){ h+='<div class="card"><b>Section '+x.s.n+'</b> <span class="mu">'+esc(x.s.l)+', '+x.s.m+' mark'+(x.s.m>1?"s":"")+' each</span></div>';
    x.items.forEach(function(q,qi){ h+='<div class="card" data-s="'+si+'" data-i="'+qi+'"><div><b>'+(qi+1)+'.</b> '+esc(q.q)+'</div>'+(x.s.t==="mcq"?'<div class="mcq"></div>':'<textarea placeholder="Your answer…"></textarea><div class="row" style="margin-top:6px"><button class="b mk">Self-mark</button></div><div class="mkp"></div>')+'</div>'; }); });
  h+='<div class="card"><div class="row"><button class="b p" id="fin">Finish and score</button></div><div id="res"></div></div>';
  el(h);
  var t0=Date.now(), tm=setInterval(function(){ var c=document.getElementById("clock"); if(!c){ clearInterval(tm); return; } var r=Math.max(0,3*3600000-(Date.now()-t0)); c.textContent="Time left "+Math.floor(r/3600000)+":"+("0"+Math.floor(r%3600000/60000)).slice(-2)+":"+("0"+Math.floor(r%60000/1000)).slice(-2); },1000);
  document.getElementById("q").onclick=function(){ if(confirm("Leave the mock exam?")){ clearInterval(tm); go("mock"); } };
  var score={}; // key "s-i" -> marks
  secs.forEach(function(x,si){ x.items.forEach(function(q,qi){
    var card=app.querySelector('[data-s="'+si+'"][data-i="'+qi+'"]');
    if(x.s.t==="mcq"){ var v=view(q), box=card.querySelector(".mcq"), done=false; v.opts.forEach(function(t,k){ var b=document.createElement("button"); b.className="opt"; b.textContent=t; b.onclick=function(){ if(done) return; done=true; var ok=k===v.a; score[si+"-"+qi]=ok?x.s.m:0; record(q.id,ok,q.unit); [].forEach.call(box.children,function(c,j){ if(j===v.a) c.classList.add("ok"); else if(j===k) c.classList.add("no"); c.disabled=true; }); }; box.appendChild(b); }); }
    else { card.querySelector(".mk").onclick=function(){ var p=card.querySelector(".mkp"), max=q.pts.reduce(function(a,z){return a+ptNum(z);},0);
      p.innerHTML=q.pts.map(function(z,k){return '<label class="pt"><input type="checkbox" data-k="'+k+'"><span>'+esc(z)+'</span></label>';}).join("")+'<div class="mu sc"></div>';
      function upd(){ var s=0; p.querySelectorAll("input").forEach(function(c){ if(c.checked) s+=ptNum(q.pts[+c.dataset.k]); }); var m=Math.round(10*x.s.m*Math.min(1,s/max))/10; score[si+"-"+qi]=m; p.querySelector(".sc").textContent="Marks for this answer: "+m+" / "+x.s.m; }
      p.querySelectorAll("input").forEach(function(c){ c.onchange=upd; }); upd(); this.disabled=true; }; }
  }); });
  document.getElementById("fin").onclick=function(){
    var out="",tot=0,mx=0;
    secs.forEach(function(x,si){ var got=x.items.map(function(_,qi){return score[si+"-"+qi]||0;}).sort(function(a,b){return b-a;}).slice(0,x.s.pick).reduce(function(a,b){return a+b;},0); var m=Math.min(x.s.pick,x.items.length)*x.s.m; tot+=got; mx+=m; out+='<p>Section '+x.s.n+': <b>'+Math.round(got*10)/10+' / '+m+'</b> <span class="mu">(best '+Math.min(x.s.pick,x.items.length)+' answers counted)</span></p>'; });
    document.getElementById("res").innerHTML='<div class="why">'+out+'<p class="big">'+Math.round(tot*10)/10+' / '+mx+'</p><p class="mu">'+(mx?Math.round(100*tot/mx):0)+'%. Marks are your own self-marking, so be strict.</p></div>';
  };
}

/* ---------- Progress ---------- */
function progress(){
  var s=load(), h='<h2>Progress</h2>';
  units().forEach(function(u,i){ var qs=u.quiz||[], seen=0,r=0,w=0; qs.forEach(function(q){ var x=s.items[q.id]; if(x){ seen++; r+=x.r; w+=x.w; } }); var pct=qs.length?Math.round(100*seen/qs.length):0;
    h+='<div class="card"><b>Unit '+(i+1)+': '+esc(u.title)+'</b><div class="mu">Seen '+seen+' / '+qs.length+' questions · '+(r+w?Math.round(100*r/(r+w))+'% correct overall':'no answers yet')+'</div><div class="bar" style="margin-top:6px"><i style="width:'+pct+'%"></i></div></div>'; });
  var weak=allQuiz().filter(function(q){ var x=s.items[q.id]; return x&&x.w>x.r; });
  h+='<div class="card"><b>Weak questions ('+weak.length+')</b>'+(weak.length?'<ul>'+weak.slice(0,12).map(function(q){return '<li>'+esc(q.q)+'</li>';}).join("")+'</ul>':'<p class="mu">None yet.</p>')+'</div>';
  var wr=Object.keys(s.written), ws=wr.reduce(function(a,k){return a+s.written[k].s;},0), wm=wr.reduce(function(a,k){return a+s.written[k].max;},0);
  h+='<div class="card"><b>Written practice</b><p class="mu">'+(wr.length?wr.length+' answers self-marked · '+Math.round(100*ws/wm)+'% of marking points covered':'No written answers yet')+'</p></div>';
  h+='<div class="card"><b>Backup</b><p class="mu">Your progress is stored in this browser only. Export a copy now and then.</p><div class="row"><button class="b" id="ex">Export</button><button class="b" id="im">Import</button><button class="b" id="rs">Reset</button></div><textarea id="bk" style="display:none" placeholder="Paste exported text here, then press Import again"></textarea></div>';
  el(h);
  document.getElementById("ex").onclick=function(){ var t=JSON.stringify(load()), a=document.getElementById("bk"); a.style.display="block"; a.value=t; a.select(); };
  document.getElementById("im").onclick=function(){ var a=document.getElementById("bk"); if(a.style.display==="none"){ a.style.display="block"; a.value=""; return; } try{ var o=JSON.parse(a.value); if(!o.items) throw 0; mem=o; save(); go("progress"); }catch(e){ alert("That text is not a valid backup."); } };
  document.getElementById("rs").onclick=function(){ if(confirm("Erase all progress on this device?")){ mem={items:{},log:[],fmt:"new",written:{}}; save(); go("progress"); } };
}

document.getElementById("sub").textContent=window.CNW.code;
go("home");
</script>
